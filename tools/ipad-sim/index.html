<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Briefing Reader iPad Mockup</title>
<style>
  /* A browser mockup of the Briefing Reader screens at iPad size, opening the real sample files.
     It imitates the app's layout and behavior. It is NOT the Swift app running, so it proves nothing
     about compiling, PDFKit, AVKit, the file picker or Single App Mode. Pinch zoom and battery are not in it. */
  :root { --ink:#363636; --ink2:#6B6B6B; --hair:#E3E1DE; --paper:#fff; --well:#F7F6F4; --backdrop:#F1F0EE; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #bdbdbd; overflow: hidden;
    font-family: Avenir, "Avenir Next", "Nunito Sans", "Segoe UI", system-ui, sans-serif; color: var(--ink); }
  #toolbar { position: fixed; top: 8px; left: 8px; z-index: 50; display: flex; gap: 8px; align-items: center; font-size: 13px; color: #333; }
  #toolbar button { font: inherit; padding: 5px 10px; border: 1px solid #888; background: #eee; border-radius: 6px; cursor: pointer; }
  #stagewrap { position: absolute; inset: 0; display: grid; place-items: center; }
  #frame { background: #1c1c1c; padding: 16px; border-radius: 40px; transform-origin: center center; position: absolute; left: 50%; top: 50%; margin-top: 18px; }
  #screen { position: relative; overflow: hidden; background: var(--paper); border-radius: 22px; --cols: 4; }
  #screen.port { --cols: 3; }
  .view { position: absolute; inset: 0; }
  .hidden { display: none !important; }
  svg { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; vertical-align: -0.12em; }

  /* ---------- Library ---------- */
  #library { overflow-y: auto; padding: 40px 56px 56px; }
  .port #library { padding: 32px 40px 48px; }
  .head { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
  .head img { width: 300px; display: block; } .port .head img { width: 230px; }
  .status { display: flex; gap: 10px; align-items: center; font-size: 14px; color: var(--ink2); }
  .iconbtn { border: 0; background: none; font-size: 20px; width: 44px; height: 44px; color: inherit; cursor: pointer; border-radius: 8px; }
  .iconbtn:active { opacity: .5; }
  .mbtn { font: inherit; font-weight: 500; font-size: 15px; color: var(--ink); background: none; border: 1px solid var(--hair); padding: 8px 12px; cursor: pointer; white-space: nowrap; }
  .rule { height: 1px; background: var(--hair); margin: 16px 0; }
  .bar { display: flex; justify-content: space-between; align-items: baseline; }
  .bar .t { font-weight: 500; font-size: 15px; letter-spacing: .23em; text-transform: uppercase; }
  .bar .c { font-size: 15px; color: var(--ink2); }
  .continue { display: flex; align-items: center; gap: 28px; padding: 24px; border: 1px solid var(--hair); margin-top: 36px; cursor: pointer; }
  .continue:active, .card:active, .arow:active { opacity: .65; }
  .continue .cv { width: 200px; height: 130px; background: var(--well); border: 1px solid var(--hair); display: grid; place-items: center; flex: none; }
  .continue .cv canvas, .continue .cv img { max-width: 184px; max-height: 114px; border: 1px solid var(--hair); }
  .continue .lbl { font-size: 12px; letter-spacing: .25em; color: var(--ink2); font-weight: 500; }
  .continue h2 { margin: 8px 0; font-size: 24px; font-weight: 500; }
  .continue .det { font-size: 15px; color: var(--ink2); }
  .pb { height: 3px; background: var(--hair); margin-top: 10px; max-width: 360px; } .pb i { display: block; height: 100%; background: var(--ink); }
  section.coll { margin-top: 44px; }
  .sh { display: flex; align-items: baseline; gap: 16px; }
  .sh h2 { margin: 0; font-size: 26px; font-weight: 500; }
  .sh .sub { font-size: 16px; color: var(--ink2); margin-top: 6px; }
  .tag { font-size: 11px; letter-spacing: .2em; font-weight: 500; padding: 4px 8px; border: 1px solid var(--ink); }
  .tag.fill { background: var(--ink); color: #fff; border-color: var(--ink); }
  .note { color: var(--ink2); font-size: 16px; margin: 10px 0 0; }
  .notesbtn { margin-left: auto; border: 0; background: none; font: inherit; font-weight: 500; font-size: 15px; cursor: pointer; color: var(--ink); }
  .agenda { border: 1px solid var(--hair); margin: 22px 0 6px; }
  .arow { display: flex; align-items: baseline; gap: 20px; padding: 16px 20px; border-bottom: 1px solid var(--hair); }
  .arow:last-child { border-bottom: 0; }
  .arow.now { background: var(--well); }
  .arow .tm { width: 96px; font-weight: 500; font-size: 16px; font-variant-numeric: tabular-nums; flex: none; }
  .arow .tt { font-weight: 500; font-size: 18px; } .arow .pr { color: var(--ink2); font-size: 15px; margin-top: 4px; }
  .arow .sp { flex: 1; } .arow.go { cursor: pointer; }
  /* Orientation: landscape puts the agenda beside the materials, portrait stacks them */
  .split { display: block; }
  .land .split { display: flex; gap: 40px; align-items: flex-start; }
  .land .split .agenda { width: 380px; flex: none; }
  .land .split .grid { flex: 1; grid-template-columns: repeat(2, 1fr); margin-top: 22px; }
  .grid { display: grid; grid-template-columns: repeat(var(--cols), 1fr); gap: 44px 32px; margin-top: 28px; }
  .card { cursor: pointer; }
  .cover { position: relative; height: 200px; background: var(--well); border: 1px solid var(--hair); display: grid; place-items: center; }
  .port .cover { height: 170px; }
  .cover canvas, .cover img, .cover video { max-width: calc(100% - 28px); max-height: 172px; border: 1px solid var(--hair); background: #fff; }
  .port .cover canvas, .port .cover img, .port .cover video { max-height: 142px; }
  .cover .new { position: absolute; top: 8px; left: 8px; background: var(--ink); color: #fff; font-size: 10px; letter-spacing: .15em; padding: 3px 7px; font-weight: 500; }
  .cover .play { position: absolute; font-size: 46px; color: rgba(255,255,255,.92); filter: drop-shadow(0 1px 4px rgba(0,0,0,.4)); }
  .card .pb { max-width: none; margin: 12px 0 0; }
  .card h3 { margin: 14px 0 4px; font-weight: 500; font-size: 19px; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card p { margin: 0; font-size: 15px; color: var(--ink2); }
  .empty { color: var(--ink2); font-weight: 300; font-size: 22px; text-align: center; padding: 100px 0; }
  .empty button { margin-top: 24px; font: inherit; font-weight: 500; font-size: 18px; background: var(--ink); color: #fff; border: 0; padding: 14px 28px; cursor: pointer; }

  /* ---------- Reader (PDF) ---------- */
  #reader { background: var(--backdrop); touch-action: none; }
  #pagearea { position: absolute; left: 0; right: 0; top: 0; bottom: 30px; display: grid; place-items: center; }
  #pageholder { position: relative; display: flex; align-items: center; }
  #pageholder .pg { position: relative; } #pageholder canvas { display: block; background: #fff; }
  #pageholder .gutter { position: absolute; left: 50%; top: 0; bottom: 0; width: 46px; margin-left: -23px; background: linear-gradient(90deg, transparent, rgba(0,0,0,.10), transparent); pointer-events: none; }
  .link { position: absolute; cursor: pointer; }
  .ink { position: absolute; left: 0; top: 0; pointer-events: none; touch-action: none; }
  #reader.pen .ink { pointer-events: auto; cursor: crosshair; }
  #penbar { position: absolute; top: 12px; right: 16px; z-index: 8; display: flex; gap: 6px; align-items: center; background: rgba(255,255,255,.97); border: 1px solid var(--hair); padding: 6px 8px; border-radius: 10px; box-shadow: 0 4px 18px rgba(0,0,0,.18); }
  #penbar button { font: inherit; font-size: 14px; border: 1px solid var(--hair); background: #fff; padding: 7px 10px; cursor: pointer; color: var(--ink); }
  #penbar button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  #penbar .dot { width: 26px; height: 26px; border-radius: 50%; padding: 0; border: 2px solid #fff; box-shadow: 0 0 0 1px var(--hair); }
  #penbar .dot.on { box-shadow: 0 0 0 2px var(--ink); background-clip: padding-box; }
  #penbar .done { background: var(--ink); color: #fff; border-color: var(--ink); font-weight: 500; }
  #foot { position: absolute; left: 0; right: 0; bottom: 0; height: 30px; display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--ink2); }
  #foot .st { position: absolute; right: 24px; font-size: 12px; }
  #ribbon { position: absolute; top: 0; right: 36px; font-size: 40px; color: var(--ink); pointer-events: none; }
  #ribbon svg { fill: currentColor; }
  .topbar, .botbar { position: absolute; left: 0; right: 0; background: rgba(255,255,255,.97); z-index: 5; }
  .topbar { top: 0; padding: 8px 20px; border-bottom: 1px solid var(--hair); display: flex; align-items: center; }
  .topbar .ttl { position: absolute; left: 290px; right: 290px; text-align: center; font-weight: 500; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; }
  .port .topbar .ttl { display: none; }   /* portrait: icons only, like Kindle */
  .topbar .sp { flex: 1; }
  .botbar { bottom: 0; padding: 14px 32px 16px; border-top: 1px solid var(--hair); }
  .prev { display: flex; flex-direction: column; align-items: center; gap: 8px; margin-bottom: 12px; }
  .prev canvas { height: 170px; border: 1px solid var(--hair); box-shadow: 0 2px 8px rgba(0,0,0,.14); background: #fff; }
  .prev span { font-weight: 500; font-size: 15px; }
  .sl { display: flex; align-items: center; gap: 14px; font-size: 14px; font-variant-numeric: tabular-nums; }
  .sl input { flex: 1; accent-color: var(--ink); }
  .slide-l { animation: sl .18s ease-out; } .slide-r { animation: sr .18s ease-out; }
  @keyframes sl { from { transform: translateX(60px); opacity: .4 } to { transform: none; opacity: 1 } }
  @keyframes sr { from { transform: translateX(-60px); opacity: .4 } to { transform: none; opacity: 1 } }

  /* ---------- Gallery / player (dark) ---------- */
  #gallery, #player { background: #111; color: #fff; }
  #gallery .stage { position: absolute; inset: 0; display: grid; place-items: center; overflow: hidden; }
  #gallery img { max-width: 100%; max-height: 100%; transition: transform .2s; user-select: none; -webkit-user-drag: none; }
  .darkbar { position: absolute; left: 0; right: 0; top: 0; background: rgba(0,0,0,.6); padding: 8px 20px; display: flex; align-items: center; z-index: 5; color: #fff; }
  .darkbar .ttl { position: absolute; left: 180px; right: 180px; text-align: center; font-weight: 500; font-size: 17px; pointer-events: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gfoot { position: absolute; left: 0; right: 0; bottom: 10px; padding: 0 24px; display: flex; justify-content: space-between; font-size: 13px; color: rgba(255,255,255,.55); }
  #player video { position: absolute; inset: 0; width: 100%; height: 100%; background: #000; }

  /* ---------- Overlays ---------- */
  #dim { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; z-index: 60; }
  #sheet { position: absolute; inset: 0; background: rgba(0,0,0,.3); z-index: 30; }
  #sheetbox { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); width: 600px; max-width: 92%; max-height: 88%; background: #fff; border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; color: var(--ink); }
  .port #sheetbox { width: 620px; }
  #sheetbox header { padding: 14px 20px; border-bottom: 1px solid var(--hair); display: flex; justify-content: space-between; align-items: center; font-weight: 500; }
  #sheetbox header a { cursor: pointer; font-weight: 500; }
  #sheetbody { overflow-y: auto; }
  .sech { padding: 10px 20px 6px; font-size: 12px; letter-spacing: .15em; text-transform: uppercase; color: var(--ink2); background: var(--well); }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--hair); cursor: pointer; }
  .row:active { background: var(--well); } .row .pg { color: var(--ink2); font-variant-numeric: tabular-nums; }
  .row .snip { color: var(--ink2); font-size: 15px; margin-top: 4px; }
  #sheetbody textarea { width: 100%; height: 360px; border: 0; padding: 18px 20px; font: inherit; font-size: 19px; resize: none; outline: none; color: var(--ink); }
  .sbar { display: flex; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--hair); }
  .sbar input { flex: 1; font: inherit; font-size: 18px; border: 0; outline: none; }
  /* Manage */
  .mrow { display: flex; align-items: center; gap: 16px; padding: 14px 20px; border-bottom: 1px solid var(--hair); cursor: pointer; }
  .mrow:active { background: var(--well); } .mrow.static { cursor: default; } .mrow.static:active { background: none; }
  .mrow .mi { font-size: 26px; width: 40px; text-align: center; }
  .mrow b { display: block; font-weight: 500; font-size: 18px; } .mrow small { color: var(--ink2); font-size: 15px; }
  .mrow .mgrow { flex: 1; } .mrow .chev { color: var(--ink2); }
  .mrow button, .linkbtn { font: inherit; font-size: 16px; font-weight: 500; background: none; border: 0; color: var(--ink); cursor: pointer; padding: 6px 4px; }
  .red { color: #c0392b !important; }
  .mfoot { margin: 0; padding: 10px 20px 16px; font-size: 14px; color: var(--ink2); }
  .form { padding: 18px 20px; display: grid; gap: 14px; }
  .form input[type=text], .form input[type=date], .form select, .form input[type=password] { font: inherit; font-size: 18px; padding: 10px 12px; border: 1px solid var(--hair); width: 100%; }
  .form label.chk { display: flex; gap: 10px; align-items: center; font-size: 17px; }
  .seg3 { display: flex; border: 1px solid var(--ink); border-radius: 7px; overflow: hidden; }
  .seg3 button { flex: 1; padding: 9px 4px; border: 0; background: #fff; font: inherit; font-size: 14px; cursor: pointer; color: var(--ink); }
  .seg3 button.on { background: var(--ink); color: #fff; }
  .primary { font: inherit; font-weight: 500; font-size: 18px; background: var(--ink); color: #fff; border: 0; padding: 13px 20px; cursor: pointer; }
  .primary:disabled { opacity: .35; cursor: default; }
  .pinbox { text-align: center; padding: 36px 20px; display: grid; gap: 16px; justify-items: center; }
  .pinbox input { width: 220px; text-align: center; font: inherit; font-size: 24px; padding: 10px; border: 1px solid var(--hair); }
  #confirm { position: absolute; inset: 0; background: rgba(0,0,0,.35); z-index: 70; display: grid; place-items: center; }
  #confirmbox { background: #fff; border-radius: 14px; padding: 24px; width: 440px; max-width: 90%; text-align: center; color: var(--ink); }
  #confirmbox h3 { margin: 0 0 10px; font-size: 19px; font-weight: 500; } #confirmbox p { margin: 0 0 20px; font-size: 16px; color: var(--ink2); white-space: pre-line; }
  #confirmbox .btns { display: flex; gap: 10px; justify-content: center; }
  #confirmbox button { font: inherit; font-size: 17px; padding: 10px 20px; border: 1px solid var(--hair); background: #fff; cursor: pointer; }
  #confirmbox button.danger { background: #c0392b; color: #fff; border-color: #c0392b; }
  #work { position: absolute; inset: 0; background: rgba(0,0,0,.35); z-index: 70; display: grid; place-items: center; }
  #workbox { background: #fff; padding: 28px; width: 380px; text-align: center; color: var(--ink); } #workbox progress { width: 100%; }
  #pop { position: absolute; z-index: 65; background: #fff; color: var(--ink); border-radius: 12px; padding: 20px 24px; width: 340px; box-shadow: 0 6px 30px rgba(0,0,0,.28); }
  #pop .r { display: flex; gap: 10px; align-items: center; } #pop input[type=range] { flex: 1; accent-color: var(--ink); }
  #pop .seg { display: flex; margin-top: 18px; border: 1px solid var(--ink); border-radius: 7px; overflow: hidden; }
  #pop .seg button { flex: 1; padding: 7px 0; border: 0; background: #fff; font: inherit; font-size: 14px; cursor: pointer; color: var(--ink); }
  #pop .seg button.on { background: var(--ink); color: #fff; }
</style>
</head>
<body>
<div id="toolbar">
  <button id="rot">Rotate</button>
  <button id="reset">Reset progress, notes and bookmarks</button>
  <button id="restore">Restore sample content</button>
  <span>Mockup of the app screens, not the app itself. Drop PDFs, photos or videos on the iPad to add them (they stay in your browser).</span>
</div>
<input type="file" id="fin" multiple accept=".pdf,.jpg,.jpeg,.png,.gif,.webp,.heic,.mp4,.mov,.m4v,.mp3,.m4a,.wav" style="display:none">
<input type="file" id="din" webkitdirectory style="display:none">
<div id="stagewrap">
  <div id="frame">
    <div id="screen" class="land">
      <!-- Library -->
      <div id="library" class="view">
        <div class="head"><img src="../../Brand/logo-charcoal.png" alt="Altar'd State"><div class="status"><span class="clock"></span><button class="iconbtn disp" aria-label="Display"></button><button class="iconbtn" id="openSearch" aria-label="Search all documents"></button><button class="mbtn" id="openManage"></button></div></div>
        <div class="rule"></div>
        <div class="bar"><span class="t">Executive Briefings</span><span class="c" id="count"></span></div>
        <div id="cont"></div>
        <div id="colls"></div>
        <div class="empty hidden" id="empty">No briefing materials have been loaded.<br><button id="emptyAdd">Add files</button></div>
      </div>
      <!-- PDF reader -->
      <div id="reader" class="view hidden">
        <div id="pagearea"><div id="pageholder"></div></div>
        <div id="ribbon" class="hidden"></div>
        <div id="penbar" class="hidden"></div>
        <div id="foot"><span id="footl"></span><span class="st clock"></span></div>
        <div class="topbar hidden" id="rtop"></div>
        <div class="botbar hidden" id="rbot"></div>
      </div>
      <!-- Gallery -->
      <div id="gallery" class="view hidden">
        <div class="stage" id="gstage"></div>
        <div class="darkbar hidden" id="gtop"></div>
        <div class="gfoot" id="gfoot"></div>
      </div>
      <!-- Player -->
      <div id="player" class="view hidden">
        <video id="vid" controls playsinline></video>
        <div class="darkbar" id="ptop"></div>
      </div>
      <div id="dim"></div>
      <div id="sheet" class="hidden"><div id="sheetbox"><header><span id="sheettitle"></span><a id="sheetdone">Done</a></header><div id="sheetbody"></div></div></div>
      <div id="confirm" class="hidden"><div id="confirmbox"><h3 id="ctitle"></h3><p id="cbody"></p><div class="btns" id="cbtns"></div></div></div>
      <div id="work" class="hidden"><div id="workbox"><progress id="wprog" value="0" max="1"></progress><p id="wtext"></p></div></div>
      <div id="pop" class="hidden"></div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(async () => {
  const WORKER = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const wtext = await (await fetch(WORKER)).text(); // a cross-origin worker is blocked from a local page, so wrap it
  pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(new Blob([wtext], { type: 'text/javascript' }));

  const $ = (id) => document.getElementById(id);
  const screenEl = $('screen'), frame = $('frame');
  let landscape = true;
  const SIZE = () => landscape ? { w: 1024, h: 768 } : { w: 768, h: 1024 };
  const ic = {
    back: '<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',
    list: '<svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>',
    search: '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l5 5"/></svg>',
    mark: '<svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg>',
    notes: '<svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/></svg>',
    sun: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>',
    pen: '<svg viewBox="0 0 24 24"><path d="M4 20l1-4L16 5l3 3L8 19z"/><path d="M14 7l3 3"/></svg>',
    tray: '<svg viewBox="0 0 24 24"><path d="M4 13l2-8h12l2 8M4 13v6h16v-6M4 13h5l1 2h4l1-2h5"/></svg>',
    file: '<svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M12 11v6M9 14h6"/></svg>',
    folder: '<svg viewBox="0 0 24 24"><path d="M3 7h6l2 2h10v10H3z"/><path d="M12 12v5M9.5 14.5h5"/></svg>',
    play: '<svg viewBox="0 0 24 24" style="fill:currentColor;stroke:none"><circle cx="12" cy="12" r="11" opacity=".95"/><path d="M10 8l6 4-6 4z" style="fill:#555"/></svg>',
  };
  document.querySelectorAll('.disp').forEach(b => b.innerHTML = ic.sun);
  $('openManage').innerHTML = ic.tray + ' Manage';
  $('openSearch').innerHTML = ic.search;

  // ---------- storage (same idea as LibraryStore) ----------
  const store = (k, d) => { try { return JSON.parse(localStorage.getItem(k) || 'null') ?? d; } catch (e) { return d; } };
  const put = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
  let progress = store('sim2.progress', {});   // id -> {page, opened, flags}
  let tone = store('sim2.tone', 'standard'), brightness = store('sim2.brightness', 1);
  const saveProgress = () => put('sim2.progress', progress);
  const clearNotes = (only) => Object.keys(localStorage).filter(k => k.startsWith('sim2.notes') && (!only || k === 'sim2.notes.' + only)).forEach(k => localStorage.removeItem(k));
  $('reset').onclick = () => { progress = {}; put('sim2.progress', {}); clearNotes(); put('sim2.ink', {}); if (typeof ink !== 'undefined') ink = {}; renderLibrary(); };
  $('restore').onclick = () => { put('sim2.wiped', false); location.reload(); };

  // ---------- agenda logic (port of AgendaLogic in ContentModel.swift) ----------
  function minutes(text) {
    if (text == null) return null;
    let s = String(text).trim().toLowerCase(); if (!s) return null;
    let pm = false, am = false;
    if (s.endsWith('pm')) { pm = true; s = s.slice(0, -2); } else if (s.endsWith('am')) { am = true; s = s.slice(0, -2); }
    const parts = s.trim().split(':').filter(p => p !== '');
    if (!parts.length || !/^-?\d+$/.test(parts[0])) return null;
    let hour = parseInt(parts[0], 10), minute = 0;

    const it = gimgs[gi]; zoomed = false; $('gstage').innerHTML = ''; const img = document.createElement('img'); img.src = it.url; img.draggable = false; $('gstage').appendChild(img);
    img.ondblclick = () => { zoomed = !zoomed; img.style.transform = zoomed ? 'scale(2.5)' : 'none'; };
    $('gtop').classList.toggle('hidden', !gchrome); $('gfoot').classList.toggle('hidden', gchrome);
    $('gfoot').innerHTML = `<span>${gi + 1} of ${gimgs.length}</span><span class="clock"></span>`; tick();
    $('gtop').innerHTML = `<button class="iconbtn" id="gback" aria-label="Library" style="color:#fff">${ic.back}</button><span class="sp" style="flex:1"></span><button class="iconbtn" id="gnotes" style="color:#fff">${ic.notes}</button>${dispBtn('style="color:#fff" id="gdisp"')}<span class="ttl"></span>`;
    $('gtop').querySelector('.ttl').textContent = it.title; $('gback').onclick = closeToLibrary; $('gnotes').onclick = () => openNotes(curColl); $('gdisp').onclick = (e) => openPop(e.currentTarget, false);
    progress[it.id] = progress[it.id] || { page: 0, opened: Date.now() }; saveProgress();
  }
  const gal = (d) => { const n = gi + d; if (n >= 0 && n < gimgs.length) { gi = n; drawGallery(); } };
  let gx = null; $('gallery').addEventListener('pointerdown', (e) => { gx = e.target.closest('.darkbar') ? null : e.clientX; });
  $('gallery').addEventListener('pointerup', (e) => { if (gx === null) return; const dx = (e.clientX - gx) / (screenEl.getBoundingClientRect().width / screenEl.offsetWidth); gx = null; if (zoomed) return; if (Math.abs(dx) > 60) gal(dx < 0 ? 1 : -1); else if (Math.abs(dx) < 6) { gchrome = !gchrome; $('gtop').classList.toggle('hidden', !gchrome); $('gfoot').classList.toggle('hidden', gchrome); } });

  // ---------- player ----------
  function openPlayer(it) {
    show('player'); const v = $('vid'); v.src = it.url; const p = progress[it.id]; v.onloadedmetadata = () => { it.measure = Math.round(v.duration) || it.measure; if (p.page > 3 && p.page < it.measure - 5) v.currentTime = p.page; v.play().catch(() => {}); };
    v.ontimeupdate = () => { progress[it.id].page = Math.floor(v.currentTime); saveProgress(); };
    $('ptop').innerHTML = `<button class="iconbtn" id="pback" style="color:#fff">${ic.back}</button><span style="flex:1"></span><span class="clock" style="font-size:14px;color:rgba(255,255,255,.7);margin-right:8px"></span><button class="iconbtn" id="pnotes" style="color:#fff">${ic.notes}</button>${dispBtn('style="color:#fff" id="pdisp"')}`;
    tick(); $('pback').onclick = closeToLibrary; $('pnotes').onclick = () => openNotes(curColl); $('pdisp').onclick = (e) => openPop(e.currentTarget, false);
  }

  // ---------- drop files in (quick way to add, like the picker with "No meeting") ----------
  addEventListener('dragover', (e) => e.preventDefault());
  addEventListener('drop', async (e) => { e.preventDefault(); const files = [...e.dataTransfer.files]; if (files.length) { unlocked = unlocked || !store(pinKey, null); if (unlocked) await importFiles(files.map(f => ({ file: f, folder: '' })), null, ''); } });

  // ---------- demo scenes: ?demo=<name> puts the mockup in a known state (used to film the demo video) ----------
  async function runDemo(name) {
    document.body.classList.add('demo'); $('toolbar').style.display = 'none';
    const sleep = (ms) => new Promise(r => setTimeout(r, ms));
    const item = (part) => allItems().find(i => i.title.includes(part));
    const seed = (part, page, ago) => { const it = item(part); progress[it.id] = { page, opened: Date.now() - ago }; };
    // Wait until the page canvases really contain ink, not just until they exist.
    const painted = async () => { for (let i = 0; i < 80; i++) { const cs = [...document.querySelectorAll('#pageholder canvas:not(.ink)')]; if (cs.length && cs.every(c => { try { const d = c.getContext('2d').getImageData(0, 0, c.width, c.height).data; for (let k = 0; k < d.length; k += 400) if (d[k + 3] === 255 && d[k] < 200) return true; return false; } catch (e) { return false; } })) return true; await sleep(500); } return false; };
    let paintedOk = null;
    // The headless browser used for filming composites a transparent canvas over a page as solid white, which
    // hides the page. So for filming, empty writing layers are removed and the others become pictures of themselves.
    const freeze = async () => { for (const c of [...document.querySelectorAll('#pageholder canvas')]) {
      const isInk = c.classList.contains('ink');
      if (isInk && !(((ink[cur.id] || {})[+c.dataset.page] || []).length)) { c.remove(); continue; }
      const im = new Image(); im.src = c.toDataURL('image/png'); im.className = c.className; im.style.cssText = c.style.cssText + ';display:block;' + (isInk ? '' : 'background:#fff'); await im.decode(); c.replaceWith(im); } };
    const open = async (part, page, doFreeze = true) => { openItem(item(part), null, page); await sleep(1500); paintedOk = item(part).kind === 'pdf' ? await painted() : null; if (paintedOk && doFreeze) await freeze(); await sleep(1200); };
    const slider = async (i) => { chrome = true; renderBars(); const sl = $('slider'); sl.value = i; sl.dispatchEvent(new Event('input')); await sleep(2000); };
    { const t = new Date(); t.setHours(11, 20, 0, 0); window.__fakeNow = t.getTime(); tick(); }   // 11:20 AM: mid-meeting
    landscape = !name.startsWith('port'); fit();
    progress = {}; seed('Annual Report', 85, 7200e3); seed('Q4 Board Book', 13, 3600e3); renderLibrary();
    await sleep(1500);
    if (name === 'lib-land') { $('library').scrollTop = 0; }   // top of the library, so the Altar'd State wordmark shows
    else if (name === 'port-lib') { $('library').scrollTop = 0; }
    else if (name === 'spread') { await open('Q4 Board Book', 7); }
    else if (name === 'cover') { await open('Q4 Board Book', 0); }
    else if (name === 'spread-bar') { await open('Q4 Board Book', 7); await slider(19); }
    else if (name === 'port-read') { await open('Q4 Board Book', 7); }
    else if (name === 'slides') { await open('Store Performance', 3); }
    else if (name === 'long-scrub') { await open('Annual Report', 150); await slider(212); }
    else if (name === 'contents') { await open('Q4 Board Book', 7); openContents(); await sleep(800); }
    else if (name === 'night') { tone = 'night'; await open('Q4 Board Book', 7); applyTone(); await sleep(800); }
    else if (name === 'search') { openSearchAll(); const q = $('sq'); q.value = 'revenue'; q.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter' })); await sleep(9000); }
    else if (name === 'photos') { await open('Flagship Floor Plan', 0); await sleep(1500); }
    else if (name === 'manage') { unlocked = true; openManage(); await sleep(1200); }
    else if (name === 'destination') { destinationForm([{ name: 'Q4 Plan.pdf' }, { name: 'Store Photo.jpg' }, { name: 'Notes.pptx' }]); const n = $('dname'); n.value = 'Board Meeting'; n.dispatchEvent(new Event('input')); $('dconf').checked = true; await sleep(1200); }
    else if (name === 'pen') {
      await open('Store Performance', 5, false); startMarking(); await sleep(1200);
      const ik = document.querySelector('#pageholder .ink'), rr = ik.getBoundingClientRect();
      const stroke = (pts) => { const mk = (t, q) => new PointerEvent(t, { bubbles: true, pointerId: 1, clientX: rr.left + rr.width * q[0], clientY: rr.top + rr.height * q[1] }); ik.dispatchEvent(mk('pointerdown', pts[0])); pts.slice(1).forEach(q => ik.dispatchEvent(mk('pointermove', q))); ik.dispatchEvent(mk('pointerup', pts[pts.length - 1])); };
      const curve = (cx, cy, rx, ry, n = 28) => Array.from({ length: n + 1 }, (_, k) => [cx + rx * Math.cos(k / n * 6.28), cy + ry * Math.sin(k / n * 6.28)]);
      document.querySelector('#penbar [data-k="hl"]').click(); stroke([[.07, .18], [.5, .18]]);
      document.querySelector('#penbar [data-c="#c0392b"]').click(); stroke(curve(.76, .46, .14, .12));
      document.querySelector('#penbar [data-c="#1f5fbf"]').click(); stroke([[.62, .74], [.7, .72], [.78, .76], [.86, .72]]);
      await sleep(800); await freeze(); await sleep(800);
    }
    else if (name === 'video') { await open('Store Walkthrough', 0); const v = $('vid'); v.pause(); v.removeAttribute('src'); v.poster = '../../Demo/frames/video-poster.jpg'; v.load(); await sleep(2500); }   // headless Edge cannot decode the clip, so film a still from it
    document.title = 'READY ' + name + (paintedOk === null ? '' : paintedOk ? ' painted' : ' UNPAINTED');
  }
  fit(); applyBrightness(); await discover(); renderLibrary();
  { const demoName = new URLSearchParams(location.search).get('demo'); if (demoName) runDemo(demoName); }
  window.__sim = { draw: () => drawPage(), cur: () => cur, colls: () => colls.map(c => ({ folder: c.folder, title: c.title, items: c.items.map(i => i.title), agenda: !!(c.meeting && c.meeting.agenda) })), open: (name) => { const it = allItems().find(i => i.title.includes(name)); openItem(it, colls.find(c => c.folder === it.folder)); return it && it.title; }, go: (i) => goPage(i), turn, get page() { return pageIdx; }, get mode() { return mode; }, get spread() { return isSpread(); }, minutes, position, rotate: () => $('rot').click(), manage: () => { unlocked = false; openManage(); }, wipe: wipeAll, searchAll: openSearchAll, startMarking, stopMarking, ink: () => ink, pen: () => penOn };
})();
</script>
