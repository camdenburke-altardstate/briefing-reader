name: Build and test the iPad app

# Compiles the Swift app and runs its unit tests on a Mac in the cloud, with no signing and no iPad needed.
# It answers one question: does the code compile, and do the logic tests pass. It does NOT make an
# installable app (that needs your Apple Developer signing) and it does not test the kiosk lock.
# See docs/CLOUD-BUILD.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:      # the "Run workflow" button on GitHub's Actions page

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile and unit test (macOS, iPad simulator)
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Show the toolchain
        run: |
          xcodebuild -version
          swift --version
          xcrun simctl list runtimes

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project from project.yml
        run: xcodegen generate

      - name: Pick an iPad simulator
        id: sim
        run: |
          xcrun simctl list devices available | grep -E "iPad" | head -8
          ID=$(xcrun simctl list devices available | grep -E "iPad" | head -1 | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')
          echo "Using simulator: $ID"
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: Build the app and the tests
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project BriefingReader.xcodeproj \
            -scheme BriefingReader \
            -configuration Debug \
            -destination "id=${{ steps.sim.outputs.id }}" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log

      - name: Run the unit tests
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project BriefingReader.xcodeproj \
            -scheme BriefingReader \
            -configuration Debug \
            -destination "id=${{ steps.sim.outputs.id }}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee test.log

      # Screenshots: runs the real app in the simulator, opens the main screens and saves pictures.
      # A problem here never fails the build above (continue-on-error), it just means fewer pictures.
      - name: Prepare sample content for the screenshots
        continue-on-error: true
        run: |
          rm -rf /tmp/BriefingSeed /tmp/BriefingShots
          mkdir -p /tmp/BriefingShots
          cp -R SampleDecks /tmp/BriefingSeed
          python3 tools/prepare_screenshot_content.py /tmp/BriefingSeed

      - name: Run the app and take screenshots
        id: shots
        continue-on-error: true
        timeout-minutes: 25
        run: |
          set -o pipefail
          xcodebuild test \
            -project BriefingReader.xcodeproj \
            -scheme BriefingReaderUI \
            -configuration Debug \
            -destination "id=${{ steps.sim.outputs.id }}" \
            -resultBundlePath UITestResults.xcresult \
            -skip-testing:BriefingReaderUITests/WalkthroughTests \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee ui.log

      # Walk-through video: records the simulator screen while WalkthroughTests drives the app, then
      # keeps the raw video and the step times (to caption it later). Never fails the build.
      - name: Record a walkthrough video
        continue-on-error: true
        timeout-minutes: 15
        run: |
          ID="${{ steps.sim.outputs.id }}"
          rm -rf /tmp/BriefingWalk && mkdir -p /tmp/BriefingWalk
          xcrun simctl uninstall "$ID" com.altardstate.briefingreader || true   # start from an empty iPad
          xcrun simctl bootstatus "$ID" -b
          python3 -c "import time; print(time.time())" > /tmp/BriefingWalk/record-start.txt
          xcrun simctl io "$ID" recordVideo --codec=h264 --force /tmp/BriefingWalk/walkthrough-raw.mp4 > /tmp/BriefingWalk/rec.log 2>&1 &
          REC=$!
          sleep 4
          xcodebuild test \
            -project BriefingReader.xcodeproj \
            -scheme BriefingReaderUI \
            -configuration Debug \
            -destination "id=$ID" \
            -only-testing:BriefingReaderUITests/WalkthroughTests \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee /tmp/BriefingWalk/walk.log || true
          kill -INT $REC || true
          wait $REC || true
          sleep 2
          ls -l /tmp/BriefingWalk

      - name: Keep the walkthrough video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: walkthrough
          path: |
            /tmp/BriefingWalk/walkthrough-raw.mp4
            /tmp/BriefingWalk/markers.txt
            /tmp/BriefingWalk/record-start.txt
            /tmp/BriefingWalk/walk.log
          if-no-files-found: ignore
          retention-days: 14

      # The simulator hands the test a sideways, cropped picture in landscape. The whole-screen capture is
      # complete but turned 90 degrees, so turn those upright and keep them under the plain names.
      - name: Straighten the screenshots
        if: always()
        continue-on-error: true
        run: |
          cd /tmp/BriefingShots 2>/dev/null || exit 0
          for f in *-screen.png; do
            [ -e "$f" ] || continue
            base="${f%-screen.png}.png"
            case "$f" in
              *portrait*) ;;
              *) sips -r 270 "$f" >/dev/null ;;
            esac
            mv -f "$f" "$base"
          done
          ls -1

      - name: List the screenshots
        if: always()
        run: |
          {
            echo "## Screenshots taken"
            echo '```'
            (ls -1 /tmp/BriefingShots 2>/dev/null) || true
            echo '```'
            echo "## Screenshot run: test results"
            echo '```'
            (grep -E "Test Case .* (passed|failed)|error:|Executed [0-9]+ tests" ui.log 2>/dev/null | sed -E 's#^.*/BriefingReader#BriefingReader#' | sort -u | head -60) || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: /tmp/BriefingShots
          if-no-files-found: ignore
          retention-days: 14

      - name: Write a short summary
        if: always()
        run: |
          {
            echo "## Compiler errors"
            echo '```'
            (grep -E "error:" build.log 2>/dev/null | sed -E 's#^.*/BriefingReader#BriefingReader#' | sort -u | head -60) || true
            echo '```'
            echo "## Compiler warnings (first 30)"
            echo '```'
            (grep -E "warning:" build.log 2>/dev/null | sed -E 's#^.*/BriefingReader#BriefingReader#' | sort -u | head -30) || true
            echo '```'
            echo "## Test results"
            echo '```'
            (grep -E "Test Case .* (passed|failed)|Executed [0-9]+ tests" test.log 2>/dev/null | tail -60) || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the full logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-and-test-logs
          path: |
            build.log
            test.log
            ui.log
          if-no-files-found: ignore
          retention-days: 14

  quick-checks:
    name: Quick checks (no Mac needed)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: The kiosk profile is well-formed XML
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils
          xmllint --noout Profiles/*.mobileconfig

      - name: The Python tools have no syntax errors
        run: python3 -m py_compile tools/make_sample_decks.py tools/make_demo_video.py tools/prepare_screenshot_content.py

      - name: project.yml is valid YAML
        run: python3 -c "import yaml,sys; yaml.safe_load(open('project.yml')); print('project.yml parses')"

      - name: No em dashes in the documents
        run: |
          if grep -rl $'\xe2\x80\x94' README.md docs/*.md; then echo "em dash found"; exit 1; fi
          echo "none"
